<!doctype html>
<html lang="id">
  <head><meta charset="UTF-8"><title>Receipt PDF verification</title></head>
  <body>
    <canvas id="receipt"></canvas>
    <script type="module">
      import { createReceiptBlob } from '../../src/lib/receiptPdf.js'
      import { createSampleInvoice } from '../../src/data/sampleInvoice.js'
      import { getDocument, GlobalWorkerOptions } from 'pdfjs-dist/build/pdf.mjs'
      import workerUrl from 'pdfjs-dist/build/pdf.worker.mjs?url'
      GlobalWorkerOptions.workerSrc = workerUrl

      window.renderReceipt = async (count = 2, paperSize = '80mm') => {
        const invoice = createSampleInvoice()
        if (count !== 2) {
          invoice.items = Array.from({ length: count }, (_, index) => ({
            id: `${index}`, name: `${index + 1} ${'Produk dengan nama panjang '.repeat(3)}`.slice(0, 80),
            quantity: '999', unitPrice: '9999999',
          }))
        }
        const blob = await createReceiptBlob(invoice, paperSize)
        const bytes = new Uint8Array(await blob.arrayBuffer())
        const task = getDocument({ data: bytes.slice() })
        const pdf = await task.promise
        const page = await pdf.getPage(1)
        const viewport = page.getViewport({ scale: 2 })
        const canvas = document.getElementById('receipt')
        canvas.width = Math.ceil(viewport.width)
        canvas.height = Math.ceil(viewport.height)
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise
        const text = await page.getTextContent()
        const result = {
          width: page.view[2], height: page.view[3], pages: pdf.numPages,
          text: text.items.map(item => item.str).join(' '),
          bytes: Array.from(bytes),
        }
        await task.destroy()
        return result
      }
    </script>
  </body>
</html>
